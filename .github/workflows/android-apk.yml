name: Mi Polla - pruebas y APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    name: Validar reglas de la Polla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis JavaScript
        run: |
          node --check polla-core.js
          node --check app.js
          node --check service-worker.js
      - name: Probar reglas (sin retroactividad, diez únicos, bloqueos)
        run: node scripts/test-polla-core.cjs
  android:
    name: Compilar APK de Mi Polla
    needs: probar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verificar SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
      - name: Incorporar app offline al APK
        run: |
          mkdir -p android/app/src/main/assets/www/assets
          cp index.html styles.css polla-core.js app.js manifest.webmanifest service-worker.js android/app/src/main/assets/www/
          cp assets/icon.svg android/app/src/main/assets/www/assets/
      - name: Compilar APK de prueba
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK instalable de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Polla-APK-Prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Configurar firma estable si hay secretos privados
        env:
          MI_POLLA_KEYSTORE_B64: ${{ secrets.MI_POLLA_KEYSTORE_B64 }}
          MI_POLLA_STORE_PASSWORD: ${{ secrets.MI_POLLA_STORE_PASSWORD }}
          MI_POLLA_KEY_ALIAS: ${{ secrets.MI_POLLA_KEY_ALIAS }}
          MI_POLLA_KEY_PASSWORD: ${{ secrets.MI_POLLA_KEY_PASSWORD }}
        run: |
          if [ -n "$MI_POLLA_KEYSTORE_B64" ] && [ -n "$MI_POLLA_STORE_PASSWORD" ] && [ -n "$MI_POLLA_KEY_ALIAS" ] && [ -n "$MI_POLLA_KEY_PASSWORD" ]; then
            echo "$MI_POLLA_KEYSTORE_B64" | base64 --decode > android/mi-polla-release.keystore
            echo "MI_POLLA_KEYSTORE_FILE=mi-polla-release.keystore" >> "$GITHUB_ENV"
            echo "MI_POLLA_STORE_PASSWORD=$MI_POLLA_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MI_POLLA_KEY_ALIAS=$MI_POLLA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MI_POLLA_KEY_PASSWORD=$MI_POLLA_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No se definieron secretos de firma. Se publica APK de prueba."
          fi
      - name: Compilar APK actualizable con firma privada
        if: ${{ env.MI_POLLA_KEYSTORE_FILE != '' }}
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publicar APK firmada estable
        if: ${{ env.MI_POLLA_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Polla-APK-Actualizable
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Eliminar llave de firma del entorno
        if: always()
        run: rm -f android/mi-polla-release.keystore

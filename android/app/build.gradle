plugins {
    id 'com.android.application'
}
android {
    namespace 'ar.mipolla.personal'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.mipolla.personal'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            resValue 'string', 'app_display_name', 'Mi Polla'
            if (System.getenv("MI_POLLA_KEYSTORE_FILE")) {
                storeFile rootProject.file(System.getenv("MI_POLLA_KEYSTORE_FILE"))
                storePassword System.getenv("MI_POLLA_STORE_PASSWORD")
                keyAlias System.getenv("MI_POLLA_KEY_ALIAS")
                keyPassword System.getenv("MI_POLLA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            // La v0.1 tenía una firma efímera de depuración.
            // Instalar en paralelo evita perder números e historial.
            applicationIdSuffix '.nueva'
            resValue 'string', 'app_display_name', 'Mi Polla nueva'
        }
        release {
            if (System.getenv("MI_POLLA_KEYSTORE_FILE")) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

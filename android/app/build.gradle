plugins {
    id 'com.android.application'
}
android {
    namespace 'ar.mipolla.personal'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.mipolla.personal'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

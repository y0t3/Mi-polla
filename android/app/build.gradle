plugins {
    id 'com.android.application'
}
android {
    namespace 'ar.mipolla.personal'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.mipolla.personal'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv("MI_POLLA_KEYSTORE_FILE")) {
                storeFile file(System.getenv("MI_POLLA_KEYSTORE_FILE"))
                storePassword System.getenv("MI_POLLA_STORE_PASSWORD")
                keyAlias System.getenv("MI_POLLA_KEY_ALIAS")
                keyPassword System.getenv("MI_POLLA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            if (System.getenv("MI_POLLA_KEYSTORE_FILE")) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
